stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "registry.gitlab.com/masbit-sam/spontime/adam-dating-backend"
  DEPLOYMENT_NAME: "spontime-backend"
  DEV_NAMESPACE: "spontime-dev"
  STG_NAMESPACE: "spontime-stg"
  TST_NAMESPACE: "spontime-tst"
  PRD_NAMESPACE: "spontime-prd"
  KUBECONFIG: "/home/gitlab-runner/.kube/config"

before_script:
  # Increase Docker timeout for slow VPN
  - export DOCKER_CLIENT_TIMEOUT=300
  - export COMPOSE_HTTP_TIMEOUT=300

  # Docker login with retry
  - |
    for i in {1..3}; do
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY && break
      echo "Docker login failed, retrying ($i)..."
      sleep 5
    done

# --------------------------
# Build & Push Docker Image
# --------------------------
build-image:
  stage: build
  tags:
    - vpn-runner
  image: docker:24
  services:
    - docker:24-dind
  script:
    - echo "Building Docker image..."
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHA" .

    # Tag per branch and push with retry
    - |
      if [[ "$CI_COMMIT_BRANCH" == "dev" ]]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME:dev-latest"
        for i in {1..3}; do
          docker push "$IMAGE_NAME:dev-latest" && break
          echo "Retrying docker push (dev-latest) ($i)..."
          sleep 5
        done
      elif [[ "$CI_COMMIT_BRANCH" == "tst" ]]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME:tst-latest"
        for i in {1..3}; do
          docker push "$IMAGE_NAME:tst-latest" && break
          echo "Retrying docker push (tst-latest) ($i)..."
          sleep 5
        done
      elif [[ "$CI_COMMIT_BRANCH" == "stage" ]]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME:stage-latest"
        for i in {1..3}; do
          docker push "$IMAGE_NAME:stage-latest" && break
          echo "Retrying docker push (stage-latest) ($i)..."
          sleep 5
        done
      elif [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME:prod-latest"
        for i in {1..3}; do
          docker push "$IMAGE_NAME:prod-latest" && break
          echo "Retrying docker push (prod-latest) ($i)..."
          sleep 5
        done
      fi

    # Push SHA tag with retry
    - |
      for i in {1..3}; do
        docker push "$IMAGE_NAME:$CI_COMMIT_SHA" && break
        echo "Retrying docker push ($CI_COMMIT_SHA) ($i)..."
        sleep 5
      done

  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^dev$|^stage$|^tst$|^main$/'

# --------------------------
# Deploy to Dev
# --------------------------
deploy-dev:
  stage: deploy
  tags:
    - vpn-runner
  script:
    - kubectl --kubeconfig "$KUBECONFIG" apply -f /home/speqto/adam-dating-backend/spontime-backend-dev.yaml -n $DEV_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" set image deployment/$DEPLOYMENT_NAME spontime-backend="$IMAGE_NAME:dev-latest" -n $DEV_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/$DEPLOYMENT_NAME -n $DEV_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/$DEPLOYMENT_NAME -n $DEV_NAMESPACE
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

# --------------------------
# Deploy to Staging
# --------------------------
deploy-stg:
  stage: deploy
  tags:
    - vpn-runner
  script:
    - kubectl --kubeconfig "$KUBECONFIG" apply -f /home/speqto/stg-spontime-backend/adam-dating-backend/spontime-backend-stg.yaml -n $STG_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" set image deployment/spontime-backend-stg spontime-backend="$IMAGE_NAME:stage-latest" -n $STG_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/spontime-backend-stg -n $STG_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/spontime-backend-stg -n $STG_NAMESPACE
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'

# --------------------------
# Deploy to TST
# --------------------------
deploy-tst:
  stage: deploy
  tags:
    - vpn-runner
  script:
    - kubectl --kubeconfig "$KUBECONFIG" apply -f /home/speqto/tst-spontime-backend/adam-dating-backend/spontime-backend-tst.yaml -n $TST_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" set image deployment/spontime-backend-tst spontime-backend-tst="$IMAGE_NAME:tst-latest" -n $TST_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/spontime-backend-tst -n $TST_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/spontime-backend-tst -n $TST_NAMESPACE
  rules:
    - if: '$CI_COMMIT_BRANCH == "tst"'

# --------------------------
# Deploy to Production
# --------------------------
deploy-prd:
  stage: deploy
  tags:
    - vpn-runner
  script:
    - kubectl --kubeconfig "$KUBECONFIG" apply -f /home/gitlab-runner/deploy/spontime-backend-prd.yaml -n $PRD_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" set image deployment/$DEPLOYMENT_NAME spontime-backend="$IMAGE_NAME:prod-latest" -n $PRD_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/$DEPLOYMENT_NAME -n $PRD_NAMESPACE
    - kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/$DEPLOYMENT_NAME -n $PRD_NAMESPACE
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
